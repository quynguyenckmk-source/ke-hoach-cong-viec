<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kế Hoạch Công Việc Tháng</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">

  <!-- Header -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 py-4 flex flex-wrap items-center justify-between gap-4">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-lg bg-indigo-600 flex items-center justify-center text-white shadow">
          <i class="fa-solid fa-calendar-check text-lg"></i>
        </div>
        <div>
          <h1 class="text-xl font-bold text-slate-900 leading-tight">Kế Hoạch Công Việc</h1>
          <p class="text-xs text-slate-500" id="current-date-txt"></p>
        </div>
      </div>

      <!-- Quick actions -->
      <div class="flex items-center gap-2">
        <button onclick="openModal()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold rounded-lg shadow transition flex items-center gap-2">
          <i class="fa-solid fa-plus"></i> Thêm việc mới
        </button>
        <button onclick="exportData()" class="p-2 border border-slate-200 hover:bg-slate-100 rounded-lg text-slate-600 transition" title="Sao lưu dữ liệu">
          <i class="fa-solid fa-download"></i>
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 py-6 space-y-6">

    <!-- Progress Cards -->
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
      <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">
        <div>
          <p class="text-xs font-semibold uppercase tracking-wider text-slate-400">Tổng công việc</p>
          <p class="text-2xl font-bold text-slate-900 mt-1" id="stat-total">0</p>
        </div>
        <div class="w-10 h-10 rounded-full bg-blue-50 text-blue-600 flex items-center justify-center">
          <i class="fa-solid fa-list-check"></i>
        </div>
      </div>

      <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">
        <div>
          <p class="text-xs font-semibold uppercase tracking-wider text-amber-500">Đang thực hiện</p>
          <p class="text-2xl font-bold text-slate-900 mt-1" id="stat-progress">0</p>
        </div>
        <div class="w-10 h-10 rounded-full bg-amber-50 text-amber-600 flex items-center justify-center">
          <i class="fa-solid fa-spinner"></i>
        </div>
      </div>

      <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">
        <div>
          <p class="text-xs font-semibold uppercase tracking-wider text-emerald-600">Đã hoàn thành</p>
          <p class="text-2xl font-bold text-slate-900 mt-1" id="stat-completed">0</p>
        </div>
        <div class="w-10 h-10 rounded-full bg-emerald-50 text-emerald-600 flex items-center justify-center">
          <i class="fa-solid fa-check"></i>
        </div>
      </div>

      <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">
        <div>
          <p class="text-xs font-semibold uppercase tracking-wider text-indigo-600">Tiến độ tháng</p>
          <p class="text-2xl font-bold text-slate-900 mt-1" id="stat-rate">0%</p>
        </div>
        <div class="w-10 h-10 rounded-full bg-indigo-50 text-indigo-600 flex items-center justify-center">
          <i class="fa-solid fa-chart-pie"></i>
        </div>
      </div>
    </div>

    <!-- Month Navigation & View Filter -->
    <div class="flex flex-wrap items-center justify-between gap-4 bg-white p-4 rounded-xl border border-slate-200">
      <div class="flex items-center gap-3">
        <button onclick="changeMonth(-1)" class="p-2 hover:bg-slate-100 rounded-lg text-slate-600">
          <i class="fa-solid fa-chevron-left"></i>
        </button>
        <span class="text-lg font-bold text-slate-800" id="month-display">Tháng --/----</span>
        <button onclick="changeMonth(1)" class="p-2 hover:bg-slate-100 rounded-lg text-slate-600">
          <i class="fa-solid fa-chevron-right"></i>
        </button>
        <button onclick="setTodayMonth()" class="text-xs font-semibold px-2.5 py-1 bg-slate-100 hover:bg-slate-200 rounded text-slate-600">Tháng này</button>
      </div>

      <!-- Status Filter -->
      <div class="flex items-center gap-2">
        <span class="text-xs font-medium text-slate-500">Lọc:</span>
        <select id="filter-priority" onchange="render()" class="text-sm border border-slate-200 rounded-lg px-2.5 py-1.5 focus:outline-none focus:ring-2 focus:ring-indigo-500">
          <option value="all">Tất cả ưu tiên</option>
          <option value="Cao">Ưu tiên: Cao</option>
          <option value="Trung bình">Ưu tiên: Trung bình</option>
          <option value="Thấp">Ưu tiên: Thấp</option>
        </select>
      </div>
    </div>

    <!-- Task Columns / Kanban Board -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">

      <!-- To Do -->
      <div class="bg-slate-100/70 p-4 rounded-xl border border-slate-200">
        <div class="flex items-center justify-between mb-4">
          <span class="font-bold text-slate-700 flex items-center gap-2">
            <span class="w-2.5 h-2.5 rounded-full bg-slate-400"></span> Chờ làm
          </span>
          <span class="text-xs font-semibold bg-white border border-slate-200 px-2 py-0.5 rounded-full" id="count-todo">0</span>
        </div>
        <div id="list-todo" class="space-y-3 min-h-[300px]"></div>
      </div>

      <!-- In Progress -->
      <div class="bg-slate-100/70 p-4 rounded-xl border border-slate-200">
        <div class="flex items-center justify-between mb-4">
          <span class="font-bold text-slate-700 flex items-center gap-2">
            <span class="w-2.5 h-2.5 rounded-full bg-amber-400"></span> Đang làm
          </span>
          <span class="text-xs font-semibold bg-white border border-slate-200 px-2 py-0.5 rounded-full" id="count-progress">0</span>
        </div>
        <div id="list-progress" class="space-y-3 min-h-[300px]"></div>
      </div>

      <!-- Done -->
      <div class="bg-slate-100/70 p-4 rounded-xl border border-slate-200">
        <div class="flex items-center justify-between mb-4">
          <span class="font-bold text-slate-700 flex items-center gap-2">
            <span class="w-2.5 h-2.5 rounded-full bg-emerald-500"></span> Hoàn thành
          </span>
          <span class="text-xs font-semibold bg-white border border-slate-200 px-2 py-0.5 rounded-full" id="count-done">0</span>
        </div>
        <div id="list-done" class="space-y-3 min-h-[300px]"></div>
      </div>
    </div>
  </main>

  <!-- Modal Tạo Công Việc -->
  <div id="task-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl max-w-lg w-full p-6 shadow-xl space-y-4">
      <div class="flex items-center justify-between border-b pb-3">
        <h3 class="text-lg font-bold text-slate-900" id="modal-title">Thêm công việc mới</h3>
        <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>

      <form id="task-form" onsubmit="saveTask(event)" class="space-y-4">
        <input type="hidden" id="task-id">
        
        <div>
          <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Tên công việc *</label>
          <input type="text" id="task-title" required class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="Nhập tên nhiệm vụ...">
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Ngày hết hạn *</label>
            <input type="date" id="task-date" required class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Mức độ ưu tiên</label>
            <select id="task-priority" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
              <option value="Cao">Cao</option>
              <option value="Trung bình" selected>Trung bình</option>
              <option value="Thấp">Thấp</option>
            </select>
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Trạng thái</label>
          <select id="task-status" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
            <option value="todo">Chờ làm</option>
            <option value="progress">Đang làm</option>
            <option value="done">Hoàn thành</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Ghi chú / Chi tiết</label>
          <textarea id="task-desc" rows="3" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="Chi tiết công việc..."></textarea>
        </div>

        <div class="flex justify-end gap-2 pt-2">
          <button type="button" onclick="closeModal()" class="px-4 py-2 border border-slate-200 rounded-lg text-sm text-slate-600 hover:bg-slate-50">Hủy</button>
          <button type="submit" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-sm font-semibold">Lưu lại</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    let currentDate = new Date();
    let tasks = JSON.parse(localStorage.getItem('my_monthly_tasks') || '[]');

    // Khởi tạo ngày ban đầu
    function init() {
      const now = new Date();
      document.getElementById('current-date-txt').innerText = `Hôm nay: ${now.getDate()}/${now.getMonth() + 1}/${now.getFullYear()}`;
      document.getElementById('task-date').valueAsDate = now;
      render();
    }

    function changeMonth(delta) {
      currentDate.setMonth(currentDate.getMonth() + delta);
      render();
    }

    function setTodayMonth() {
      currentDate = new Date();
      render();
    }

    function render() {
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();
      document.getElementById('month-display').innerText = `Tháng ${month + 1}/${year}`;

      const priorityFilter = document.getElementById('filter-priority').value;

      // Lọc các công việc trong tháng đang chọn
      const monthTasks = tasks.filter(t => {
        const d = new Date(t.date);
        const matchMonth = d.getFullYear() === year && d.getMonth() === month;
        const matchPriority = priorityFilter === 'all' || t.priority === priorityFilter;
        return matchMonth && matchPriority;
      });

      // Thống kê
      const total = monthTasks.length;
      const progressCount = monthTasks.filter(t => t.status === 'progress').length;
      const doneCount = monthTasks.filter(t => t.status === 'done').length;
      const rate = total > 0 ? Math.round((doneCount / total) * 100) : 0;

      document.getElementById('stat-total').innerText = total;
      document.getElementById('stat-progress').innerText = progressCount;
      document.getElementById('stat-completed').innerText = doneCount;
      document.getElementById('stat-rate').innerText = `${rate}%`;

      // Render từng cột
      ['todo', 'progress', 'done'].forEach(status => {
        const listEl = document.getElementById(`list-${status}`);
        const statusTasks = monthTasks.filter(t => t.status === status);
        document.getElementById(`count-${status}`).innerText = statusTasks.length;

        if (statusTasks.length === 0) {
          listEl.innerHTML = `<div class="p-6 text-center text-xs text-slate-400 border border-dashed border-slate-200 rounded-lg">Không có công việc</div>`;
          return;
        }

        listEl.innerHTML = statusTasks.map(t => {
          const badgeColor = t.priority === 'Cao' ? 'bg-red-50 text-red-600 border-red-200' :
                             t.priority === 'Trung bình' ? 'bg-amber-50 text-amber-600 border-amber-200' :
                             'bg-slate-50 text-slate-600 border-slate-200';
          
          return `
            <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm hover:shadow transition space-y-2">
              <div class="flex items-start justify-between gap-2">
                <h4 class="font-semibold text-sm text-slate-900 ${t.status === 'done' ? 'line-through text-slate-400' : ''}">${escapeHtml(t.title)}</h4>
                <span class="text-[11px] font-medium px-2 py-0.5 rounded border ${badgeColor}">${t.priority}</span>
              </div>
              ${t.desc ? `<p class="text-xs text-slate-500 line-clamp-2">${escapeHtml(t.desc)}</p>` : ''}
              <div class="flex items-center justify-between text-xs text-slate-400 pt-2 border-t border-slate-100">
                <span><i class="fa-regular fa-calendar mr-1"></i>${formatDate(t.date)}</span>
                <div class="flex items-center gap-1.5">
                  ${t.status !== 'done' ? `<button onclick="changeStatus('${t.id}', 'done')" class="text-emerald-600 hover:text-emerald-700 p-1" title="Xong"><i class="fa-solid fa-check"></i></button>` : ''}
                  <button onclick="editTask('${t.id}')" class="text-blue-500 hover:text-blue-700 p-1" title="Sửa"><i class="fa-solid fa-pen"></i></button>
                  <button onclick="deleteTask('${t.id}')" class="text-red-400 hover:text-red-600 p-1" title="Xóa"><i class="fa-regular fa-trash-can"></i></button>
                </div>
              </div>
            </div>
          `;
        }).join('');
      });
    }

    function saveTask(e) {
      e.preventDefault();
      const id = document.getElementById('task-id').value;
      const taskData = {
        id: id || 'task_' + Date.now(),
        title: document.getElementById('task-title').value.trim(),
        date: document.getElementById('task-date').value,
        priority: document.getElementById('task-priority').value,
        status: document.getElementById('task-status').value,
        desc: document.getElementById('task-desc').value.trim()
      };

      if (id) {
        tasks = tasks.map(t => t.id === id ? taskData : t);
      } else {
        tasks.push(taskData);
      }

      localStorage.setItem('my_monthly_tasks', JSON.stringify(tasks));
      closeModal();
      render();
    }

    function editTask(id) {
      const task = tasks.find(t => t.id === id);
      if (!task) return;

      document.getElementById('task-id').value = task.id;
      document.getElementById('task-title').value = task.title;
      document.getElementById('task-date').value = task.date;
      document.getElementById('task-priority').value = task.priority;
      document.getElementById('task-status').value = task.status;
      document.getElementById('task-desc').value = task.desc || '';

      document.getElementById('modal-title').innerText = 'Chỉnh sửa công việc';
      document.getElementById('task-modal').classList.remove('hidden');
      document.getElementById('task-modal').classList.add('flex');
    }

    function changeStatus(id, newStatus) {
      tasks = tasks.map(t => t.id === id ? { ...t, status: newStatus } : t);
      localStorage.setItem('my_monthly_tasks', JSON.stringify(tasks));
      render();
    }

    function deleteTask(id) {
      if (confirm('Bạn có chắc muốn xóa công việc này?')) {
        tasks = tasks.filter(t => t.id !== id);
        localStorage.setItem('my_monthly_tasks', JSON.stringify(tasks));
        render();
      }
    }

    function openModal() {
      document.getElementById('task-form').reset();
      document.getElementById('task-id').value = '';
      document.getElementById('task-date').valueAsDate = new Date();
      document.getElementById('modal-title').innerText = 'Thêm công việc mới';
      document.getElementById('task-modal').classList.remove('hidden');
      document.getElementById('task-modal').classList.add('flex');
    }

    function closeModal() {
      document.getElementById('task-modal').classList.add('hidden');
      document.getElementById('task-modal').classList.remove('flex');
    }

    function formatDate(str) {
      if (!str) return '';
      const [y, m, d] = str.split('-');
      return `${d}/${m}`;
    }

    function escapeHtml(text) {
      return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function exportData() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(tasks, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `ke_hoach_cong_viec_${new Date().toISOString().slice(0,10)}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    window.onload = init;
  </script>
</body>
</html>
